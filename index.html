    <script>
      (function() {
        // Intercept and silence Vite dev server HMR websocket errors in cloud preview iframe
        var isViteWsError = function(err) {
          if (!err) return false;
          var str = String(err.message || err.reason || err);
          return str.indexOf('WebSocket') !== -1 || str.indexOf('websocket') !== -1 || str.indexOf('vite') !== -1;
        };

        window.addEventListener('unhandledrejection', function(event) {
          if (isViteWsError(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (isViteWsError(event.error) || isViteWsError(event.message)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        // Suppress Vite console.error for WebSocket in AI Studio error drawer
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var fullText = args.map(function(a) { return String(a && a.message ? a.message : a); }).join(' ');
          if (fullText.indexOf('failed to connect to websocket') !== -1 || fullText.indexOf('WebSocket closed without opened') !== -1) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };
      })();
    </script>
