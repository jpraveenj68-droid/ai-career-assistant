version: '3.8'

services:
  ai-career-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: career-intelligence-command-center
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-career-assistant-prod-secret-2026}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
